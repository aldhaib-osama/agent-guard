[project]
name = "agentguard"
version = "0.1.0"
description = "Runtime tool-call guard for LLM agents (taint tracking, exfiltration checks) with a red-team evaluation harness"
requires-python = ">=3.9"
[project.scripts]
agentguard = "agentguard.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentguard = ["data/*.json"]
